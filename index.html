<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Finder</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <header>
    <h1>GPS Finder</h1>
    <button id="settingsBtn">⚙</button>
  </header>

  <main>
    <div id="map"></div>

    <div class="info-box">
      <p id="status">Статус: Отключено</p>
      <p id="coords">Координаты: N/A</p>
      <p id="distance">Расстояние: N/A</p>
      <p id="speed">Скорость: N/A</p>
    </div>

    <div class="controls">
      <button id="connectBtn">Подключить BLE</button>
      <button id="ledOnBtn">LED ВКЛ</button>
      <button id="ledOffBtn">LED ВЫКЛ</button>
      <button id="testCoordsBtn">Тестовые координаты</button>
      <button id="historyBtn">История координат</button>
    </div>
  </main>

  <div id="settingsPanel" class="hidden">
    <h2>⚙ Настройки</h2>
    <label><input type="checkbox" id="darkTheme"> Тёмная тема</label><br>
    <label><input type="checkbox" id="showMyLocation"> Показывать моё местоположение</label><br>
    <label><input type="checkbox" id="autoFollow"> Автоматическое отслеживание</label><br>
    <label>Скорость: 
      <select id="speedUnit">
        <option value="kmh">км/ч</option>
        <option value="ms">м/с</option>
      </select>
    </label>
    <div class="settings-buttons">
      <button id="saveSettings">Сохранить</button>
      <button id="resetSettings">Сбросить</button>
      <button id="closeSettings">Отмена</button>
    </div>
  </div>

  <div id="historyPanel" class="hidden">
    <h2>📜 История координат</h2>
    <ul id="historyList"></ul>
    <button id="exportHistory">Экспортировать</button>
    <button id="closeHistory">Закрыть</button>
  </div>

  <script src="script.js"></script>
  <script src="settings.js"></script>
  <script src="history-manager.js"></script>
</body>
</html>
